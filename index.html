<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descarga de Documento - UTFSM</title>
    
    <!-- Script oficial de Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    
    <style>
        /* Estilos generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0; 
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh; 
        }

        /* Contenedor que envuelve el formulario */
        .content-wrapper {
            padding: 40px 20px;
            flex: 1; 
        }

        .container {
            max-width: 700px; 
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-top: 6px solid #002855;
        }
        
        /* --- ESTILOS DEL LOGO SUPERIOR --- */
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-container img {
            max-width: 200px;
            height: auto;
        }

        h2 {
            color: #004b87;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 500;
        }
        
        /* Layout en cuadrícula (Grid) */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }
        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        input[type="text"], 
        input[type="number"], 
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            width: 100%;
        }
        input:focus, select:focus {
            border-color: #F2A900;
            outline: none;
        }
        
        /* --- ESTILOS PARA EL CUADRADO DEL RECAPTCHA --- */
        .captcha-container {
            margin: 30px 0;
            display: flex;
            justify-content: center;
        }
        .captcha-box {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 6px;
            background-color: #f9f9f9;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: inline-block; 
        }

        /* --- BOTÓN AMARILLO --- */
        .btn-submit {
            background-color: #dfa03a;
            color: #333;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-submit:hover {
            background-color: #c78d30;
        }

        /* --- NUEVO: INFORMACIÓN DE LA UNIVERSIDAD --- */
        .university-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eaeaea; /* Línea separadora sutil */
            text-align: center;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        .university-info strong {
            color: #002855;
            font-size: 14px;
        }
        .university-info a {
            color: #004b87;
            text-decoration: none;
            font-weight: 600;
        }
        .university-info a:hover {
            text-decoration: underline;
        }

        /* --- ESTILOS DE LA IMAGEN INFERIOR --- */
        .footer-image {
            width: 100%;
            display: block;
            height: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <div class="container">
            <!-- Contenedor del Logo -->
            <div class="logo-container">
                <img src="logof.jpg" alt="Logo Universidad Técnica Federico Santa María">
            </div>
            
            <h2>Universidad Técnica Federico Santa María</h2>
            
            <form id="formularioUSM">
                
                <!-- Fila 1: Nombre y RUT -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" value="Luis Andres Fuenzalida Flores" required>
                    </div>
                    <div class="form-group">
                        <label for="rut">RUT</label>
                        <input type="text" id="rut" name="rut" value="12.865.440-2" required>
                    </div>
                </div>

                <!-- Fila 2: Sede y Carrera -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="sede">Sede</label>
                        <select id="sede" name="sede" required>
                            <option value="" disabled>Seleccione...</option>
                            <option value="Valparaíso" selected>Valparaíso</option>
                            <option value="Federico USM">Federico USM (Casa Central)</option>
                            <option value="San Joaquín">San Joaquín</option>
                            <option value="Vitacura">Vitacura</option>
                            <option value="Viña del Mar">Viña del Mar</option>
                            <option value="Concepción">Concepción</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="carrera">Carrera</label>
                        <input type="text" id="carrera" name="carrera" value="TÉCNICO EN ELECTRICIDAD" required>
                    </div>
                </div>

                <!-- Fila 3: Año, Modalidad y Nota -->
                <div class="form-row-3">
                    <div class="form-group">
                        <label for="egreso">Año de egreso</label>
                        <input type="text" id="egreso" name="egreso" value="22 de febrero de 2022" required>
                    </div>
                    <div class="form-group">
                        <label for="modalidad">Modalidad de estudios</label>
                        <select id="modalidad" name="modalidad" required>
                            <option value="" disabled>Modalidad...</option>
                            <option value="Diurna" selected>Diurna</option>
                            <option value="Vespertina">Vespertina</option>
                            <option value="Online">Online</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="nota">Nota final</label>
                        <input type="text" id="nota" name="nota" value="6,1" required>
                    </div>
                </div>

                <!-- Contenedor del reCAPTCHA dentro del Cuadrado -->
                <div class="captcha-container">
                    <div class="captcha-box">
                        <!-- Reemplaza TU_CLAVE_DE_SITIO_AQUI con tu Site Key de Google reCAPTCHA -->
                        <div class="g-recaptcha" data-sitekey="TU_CLAVE_DE_SITIO_AQUI"></div>
                    </div>
                </div>

                <!-- Botón de Envío (Cuadro Amarillo) -->
                <button type="submit" class="btn-submit">Validar y Descargar Documento</button>
            </form>

            <!-- NUEVO: Información de la Universidad debajo del botón -->
            <div class="university-info">
                <strong>Universidad Técnica Federico Santa María</strong><br>
                Sede Casa Central: Avenida España 1680, Valparaíso, Chile<br>
                Teléfono: +56 32 265 4000 | Web: <a href="https://usm.cl" target="_blank">www.usm.cl</a>
            </div>

        </div>
    </div>

    <!-- Imagen agregada al final que va de esquina a esquina -->
    <img src="ima.png" alt="Imagen Inferior" class="footer-image">

    <script>
        document.getElementById('formularioUSM').addEventListener('submit', function(event) {
            event.preventDefault(); 

            var response = grecaptcha.getResponse();

            if (response.length === 0) {
                alert("Error: Por favor, resuelva el reCAPTCHA para verificar que no es un robot.");
                return;
            }

            alert("Validación exitosa. Su documento comenzará a descargarse en breve.");
            
            const urlDocumento = 'ruta/al/documento_usm.pdf'; 
            
            const link = document.createElement('a');
            link.href = urlDocumento;
            link.download = 'Certificado_Academico_USM.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            grecaptcha.reset();
        });
    </script>
</body>
</html>
